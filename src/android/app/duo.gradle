// Eden Duo overlay for build.gradle.kts, applied by its last line. Everything Eden Duo
// changes about the upstream Android build lives here, so upstream's build.gradle.kts
// merges from each Eden nightly with a single added line.
//
// Groovy on purpose: a Kotlin script plugin does not see the Android Gradle plugin's classes
// (they load in the app project's plugins block), while Groovy resolves android {} and
// androidComponents {} dynamically.

def edenDir = project(':Eden').projectDir
// Same rule as build.gradle.kts (Kotlin toBooleanStrictOrNull): only "true" turns it on.
def isNightly = providers.gradleProperty('nightly').getOrNull() == 'true'

android {
    defaultConfig {
        // Duet Plus: Eden Duo with extra fixes, under its own ID so it installs beside Eden Duo.
        applicationId = 'com.tapionallanaire.duetplus'
        // Duet Plus release version (shown to users); versionCode stays upstream's time-based
        // value so every new build installs as an update.
        versionName = '1.1.18'

        externalNativeBuild {
            cmake {
                // Upstream's update checker asks upstream Eden's release feed and would offer
                // to install upstream Eden (another app). It stays off in every build, nightly
                // included; Eden Duo's own releases are checked by duo/DuoUpdater.kt instead.
                arguments.removeAll { it.startsWith('-DENABLE_UPDATE_CHECKER=') }
                arguments.add('-DENABLE_UPDATE_CHECKER=OFF')
            }
        }
    }

    buildTypes.getByName('release') {
        // The DSMod RE/heap-analysis developer toolkit (mod_re_tools.cpp's heap scan/diff/
        // class-dump family and the mod_console.cpp EDEN_DSMOD_CMD console) is dead weight in a
        // build a player installs -- see src/core/CMakeLists.txt's EDEN_DSMOD_BUILD_DEV_TOOLS
        // comment. Only this signed, distributable build type turns it off; relWithDebInfo/debug
        // keep the CMake default (ON) so it stays available for local/dev work.
        externalNativeBuild {
            cmake {
                arguments.add('-DEDEN_DSMOD_BUILD_DEV_TOOLS=OFF')
                // A published build ships no Vulkan validation layer (a debugging tool; the
                // renderer drops unavailable layers) and embeds no host build paths in
                // __FILE__-based assert/log strings.
                arguments.add('-DYUZU_DOWNLOAD_ANDROID_VVL=OFF')
                def prefixMap = [
                    "-ffile-prefix-map=${edenDir.absolutePath}/=".toString(),
                    "-ffile-prefix-map=${System.getProperty('user.home')}/=~/".toString()
                ]
                cFlags.addAll(prefixMap)
                cppFlags.addAll(prefixMap)
            }
        }
    }

    buildTypes.getByName('relWithDebInfo') {
        // Local development build of Eden Duo; installs beside the published release.
        manifestPlaceholders['appNameSuffix'] = ' Dev'
        applicationIdSuffix = '.dev'
    }

    productFlavors.getByName('mainline') {
        manifestPlaceholders['appNameBase'] = 'Duet Plus'
    }

    productFlavors.all { flavor ->
        // Upstream's productFlavors.all block again, after the appNameBase change above;
        // app_name follows the flavor name instead of upstream's fixed "Eden".
        def currentName = flavor.manifestPlaceholders['appNameBase'] ?: 'Eden'
        def suffix = isNightly ? ' Nightly' : ''
        flavor.resValue('string', 'app_name_suffixed', "$currentName$suffix".toString())
        flavor.resValue('string', 'app_name', "$currentName$suffix".toString())

        // Branding overlay (launcher icons, about page, reworded upstream strings). A flavor
        // source set overrides src/main/res, so upstream's resource files stay untouched.
        android.sourceSets.getByName(flavor.name).res.srcDir('src/duo/res')
    }

    lint {
        // Known findings in upstream-owned code and generated externals; new issues still fail.
        baseline = file('lint-baseline.xml')
    }
}

// The validation layer can already sit in jniLibs from a development build (the CMake step
// copies it there); keep it out of every release APK regardless.
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.packaging.jniLibs.excludes.add('**/libVkLayer_khronos_validation.so')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Save sync runs Syncthing as a child process (duo/sync/SaveSync.kt). The arm64 binary comes from
// Syncthing-Fork's release APK (github.com/researchxxl/syncthing-android, MPL-2.0; Syncthing source:
// github.com/syncthing/syncthing), built for Android with its network-interface fixes. Pinned by
// hash; bump the version and hash together. Calamansi pins the same APK.
def syncthingApk = 'com.github.catfriend1.syncthingfork_release_v2.1.7.0_arm64-v8a.apk'
def syncthingSha256 = '222a7860f2ad21f2bbf4782fcf16c2150b0c1dea60a1aae33f44e2f4d07371c1'
def syncthingJniLibs = layout.buildDirectory.dir('syncthingJniLibs').get().asFile
def fetchSyncthing = tasks.register('fetchSyncthing') {
    def apk = layout.buildDirectory.file("tmp/$syncthingApk").get().asFile
    inputs.property('sha256', syncthingSha256)
    outputs.file(new File(syncthingJniLibs, 'arm64-v8a/libsyncthing.so'))
    doLast {
        if (!apk.isFile()) {
            apk.parentFile.mkdirs()
            new URL("https://github.com/researchxxl/syncthing-android/releases/download/v2.1.7.0/$syncthingApk")
                .withInputStream { input -> apk.withOutputStream { it << input } }
        }
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(apk.bytes).encodeHex().toString()
        if (sha != syncthingSha256) {
            apk.delete()
            throw new GradleException("$syncthingApk: SHA-256 $sha, expected $syncthingSha256")
        }
        project.copy {
            from(zipTree(apk)) {
                include 'lib/arm64-v8a/libsyncthingnative.so'
                eachFile { it.relativePath = new RelativePath(true, 'arm64-v8a', 'libsyncthing.so') }
                includeEmptyDirs = false
            }
            into syncthingJniLibs
        }
    }
}
android.sourceSets.getByName('main').jniLibs.srcDir(syncthingJniLibs)
tasks.named('preBuild') { dependsOn fetchSyncthing }
